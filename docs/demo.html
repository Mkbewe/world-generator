<!doctype html>
<html lang="pl">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover" />
    <title>Świat wysp</title>
    <style>
      :root {
        box-sizing: border-box;
        padding-top: env(safe-area-inset-top, 0px);
        padding-bottom: env(safe-area-inset-bottom, 0px);
        --bg: #050b18;
        --fg: #dbe8f5;
        --mut: #7f95ad;
        --btn: #16304f;
      }
      html {
        scroll-padding-top: env(safe-area-inset-top, 0px);
      }
      body {
        margin: 0;
        background: radial-gradient(ellipse at 50% 30%, #0b1a33, var(--bg) 70%);
        color: var(--fg);
        font-family:
          system-ui,
          -apple-system,
          'Segoe UI',
          sans-serif;
        display: flex;
        flex-direction: column;
        align-items: center;
        padding: 14px 10px 24px;
        min-height: 100vh;
      }
      h1 {
        font-size: 1.25rem;
        margin: 4px 0 2px;
        font-weight: 600;
      }
      .sub {
        color: var(--mut);
        font-size: 0.8rem;
        margin-bottom: 10px;
        text-align: center;
      }
      #g {
        width: min(92vw, 560px);
        aspect-ratio: 1;
        border-radius: 50%;
        box-shadow: 0 0 50px rgba(110, 180, 255, 0.3);
        touch-action: none;
        cursor: grab;
      }
      #f {
        display: none;
        width: min(96vw, 960px);
        border-radius: 8px;
        box-shadow: 0 0 30px rgba(0, 0, 0, 0.6);
      }
      .row {
        display: flex;
        gap: 8px;
        flex-wrap: wrap;
        justify-content: center;
        margin: 14px 0 8px;
      }
      button {
        background: var(--btn);
        color: var(--fg);
        border: 1px solid #2b527f;
        padding: 8px 14px;
        border-radius: 8px;
        font-size: 0.85rem;
        cursor: pointer;
      }
      button:hover {
        background: #1f4270;
      }
      #lg {
        display: flex;
        flex-wrap: wrap;
        gap: 6px 14px;
        justify-content: center;
        max-width: 720px;
        font-size: 0.75rem;
        color: var(--mut);
        margin-top: 6px;
      }
      #lg i {
        display: inline-block;
        width: 11px;
        height: 11px;
        border-radius: 3px;
        margin-right: 5px;
        vertical-align: -1px;
      }
      #st {
        font-size: 0.75rem;
        color: var(--mut);
        min-height: 1em;
      }
    </style>
  </head>
  <body>
    <h1>Świat wysp</h1>
    <div class="sub">
      Przeciągnij, aby obracać globus. Kółko myszy, szczypanie lub przyciski +/− przybliżają. Biomy
      zależą od temperatury (szerokość, wysokość) i wilgotności.
    </div>
    <canvas id="g" width="640" height="640"></canvas>
    <canvas id="f"></canvas>
    <div class="row">
      <button id="zo">−</button><button id="zr">1.0×</button><button id="zi">+</button
      ><button id="nw">Nowy świat</button><button id="rot">Obrót: wł.</button
      ><button id="fl">Mapa płaska</button>
    </div>
    <div id="st"></div>
    <div id="lg"></div>
    <script>
      const W = 2000,
        H = 1000,
        TAU = Math.PI * 2;
      const rng = a => () => {
        a |= 0;
        a = (a + 0x6d2b79f5) | 0;
        let t = Math.imul(a ^ (a >>> 15), 1 | a);
        t = (t + Math.imul(t ^ (t >>> 7), 61 | t)) ^ t;
        return ((t ^ (t >>> 14)) >>> 0) / 4294967296;
      };
      let P = new Uint8Array(512);
      function initNoise(r) {
        const p = [...Array(256).keys()];
        for (let i = 255; i > 0; i--) {
          const j = Math.floor(r() * (i + 1));
          [p[i], p[j]] = [p[j], p[i]];
        }
        for (let i = 0; i < 512; i++) P[i] = p[i & 255];
      }
      const hh = (i, j, k) => P[P[P[i & 255] + (j & 255)] + (k & 255)] / 255;
      function vn(x, y, z) {
        const i = Math.floor(x),
          j = Math.floor(y),
          k = Math.floor(z);
        let a = x - i,
          b = y - j,
          c = z - k;
        a = a * a * (3 - 2 * a);
        b = b * b * (3 - 2 * b);
        c = c * c * (3 - 2 * c);
        const L = (u, v, t) => u + (v - u) * t;
        return L(
          L(L(hh(i, j, k), hh(i + 1, j, k), a), L(hh(i, j + 1, k), hh(i + 1, j + 1, k), a), b),
          L(
            L(hh(i, j, k + 1), hh(i + 1, j, k + 1), a),
            L(hh(i, j + 1, k + 1), hh(i + 1, j + 1, k + 1), a),
            b
          ),
          c
        );
      }
      function fbm(x, y, z, o) {
        let s = 0,
          a = 1,
          n = 0;
        for (let i = 0; i < o; i++) {
          s += a * vn(x, y, z);
          n += a;
          a *= 0.53;
          x *= 2.03;
          y *= 2.03;
          z *= 2.03;
        }
        return s / n;
      }
      const hex = h => [1, 3, 5].map(i => parseInt(h.substr(i, 2), 16));
      const B = {
        ice: ['Lód i śnieg', '#f1f6f8'],
        tundra: ['Tundra', '#a6b39b'],
        polar: ['Pustynia polarna', '#c6cdc4'],
        taiga: ['Tajga', '#3f6b4e'],
        tf: ['Las umiarkowany', '#3a7d44'],
        grass: ['Łąki', '#8fae5a'],
        steppe: ['Step', '#b8b36a'],
        mf: ['Las subtropikalny', '#5c8f3f'],
        shrub: ['Zarośla', '#a9a45e'],
        desert: ['Pustynia', '#dcc48a'],
        rain: ['Las deszczowy', '#1a6a35'],
        tropf: ['Las tropikalny', '#3f8f3a'],
        sav: ['Sawanna', '#bdb35a'],
        ash: ['Skała wulkaniczna', '#3b3534'],
        lava: ['Krater', '#6b2c1f'],
        rock: ['Skały górskie', '#7d7a74'],
        sand: ['Plaża', '#ead9a4'],
        lag: ['Laguna', '#58d3cf'],
      };
      for (const k in B) B[k] = { n: B[k][0], h: B[k][1], c: hex(B[k][1]) };
      const mix = (a, b, t) => [
        a[0] + (b[0] - a[0]) * t,
        a[1] + (b[1] - a[1]) * t,
        a[2] + (b[2] - a[2]) * t,
      ];
      const cl = (v, a, b) => (v < a ? a : v > b ? b : v);
      let isl = [],
        seed = 0,
        tex,
        td,
        lon0 = 0.5,
        zoom = 1,
        lat0 = 0.25,
        spin = true,
        drag = false,
        flat = false;

      const sph = (la, lo) => [
        Math.cos(la) * Math.sin(lo),
        Math.sin(la),
        Math.cos(la) * Math.cos(lo),
      ];
      const nrm = v => {
        const l = Math.hypot(...v) || 1;
        return v.map(x => x / l);
      };
      const cr = (a, b) => [
        a[1] * b[2] - a[2] * b[1],
        a[2] * b[0] - a[0] * b[2],
        a[0] * b[1] - a[1] * b[0],
      ];
      function basis(c) {
        let e = cr([0, 1, 0], c);
        e = Math.hypot(...e) < 1e-4 ? [1, 0, 0] : nrm(e);
        return [e, cr(c, e)];
      }
      function add(c, a, b, rot, kind, amp, sfo) {
        const [e0, n0] = basis(c),
          cs = Math.cos(rot),
          sn = Math.sin(rot);
        const e = e0.map((v, i) => v * cs + n0[i] * sn),
          n = e0.map((v, i) => -v * sn + n0[i] * cs),
          R = Math.max(a, b) * 1.9 + 0.12;
        isl.push({
          c,
          e,
          n,
          a,
          b,
          kind,
          amp: amp || 0.5,
          cosR: Math.cos(Math.min(R, 3)),
          sf: sfo || 0.35 + 0.65 * Math.min(1, Math.max(a, b) / 0.12),
        });
      }
      function move(c, d, th) {
        const [e, n] = basis(c);
        return nrm(
          c.map(
            (v, i) => v * Math.cos(d) + (e[i] * Math.cos(th) + n[i] * Math.sin(th)) * Math.sin(d)
          )
        );
      }

      function layout(r) {
        isl = [];
        const cs = [];
        const rl = (a, b) => a + (b - a) * r();
        function landmass(c, a, dir, wander, amp, n, depth = 0) {
          let pos = c,
            s = a;
          const sf = 0.35 + 0.65 * Math.min(1, (a * 1.6) / 0.12);
          for (let i = 0; i < n; i++) {
            add(pos, s, s * rl(0.35, 0.9), rl(0, 3), 0, amp, sf);
            if (depth < 1 && r() < 0.4)
              landmass(
                move(pos, s * 0.8, dir + (r() < 0.5 ? 1 : -1) * rl(0.8, 1.5)),
                s * 0.6,
                dir + rl(-1, 1),
                wander,
                amp,
                2 + Math.floor(r() * 3),
                depth + 1
              );
            pos = move(pos, s * rl(0.8, 1.4), dir);
            dir += rl(-wander, wander);
            s *= rl(0.78, 1.08);
          }
        }
        for (let n = 0; n < 34; n++) {
          let best = null,
            bd = -1;
          for (let t = 0; t < 14; t++) {
            const la = Math.asin(rl(-0.85, 0.85)),
              c = sph(la, rl(-Math.PI, Math.PI));
            let md = 9;
            for (const o of cs)
              md = Math.min(md, Math.acos(cl(c[0] * o[0] + c[1] * o[1] + c[2] * o[2], -1, 1)));
            if (md > bd) {
              bd = md;
              best = c;
            }
          }
          if (bd < 0.36) continue;
          cs.push(best);
          const c = best,
            lat = Math.asin(c[1]),
            q = r();
          let k = q < 0.3 ? 0 : q < 0.55 ? 1 : q < 0.75 ? 2 : q < 0.9 ? 3 : 4;
          if (k == 3 && Math.abs(lat) > 0.7) k = 0;
          if (k == 0) {
            const a = rl(0.04, 0.08);
            landmass(c, a, rl(0, TAU), 0.9, 0.8, 3 + Math.floor(r() * 5));
            for (let i = 0, m = 2 + Math.floor(r() * 4); i < m; i++) {
              const s = rl(0.012, 0.04);
              add(move(c, rl(0.1, 0.25), rl(0, TAU)), s, s * rl(0.6, 1), rl(0, 3), 0, 0.7);
            }
          } else if (k == 1) {
            for (let i = 0, m = 7 + Math.floor(r() * 8); i < m; i++) {
              const s = rl(0.012, 0.05);
              add(move(c, rl(0.02, 0.2), rl(0, TAU)), s, s * rl(0.5, 1), rl(0, 3), 0, 0.55);
            }
          } else if (k == 2) {
            const th = rl(0, TAU),
              a = rl(0.045, 0.08);
            add(c, a, a * rl(0.8, 1), rl(0, 3), 1, 0.3);
            const m = Math.floor(r() * 4);
            for (let i = 0; i < m; i++) {
              const s = a * rl(0.3, 0.6);
              add(move(c, a * (1.8 + i * 1.2), th + rl(-0.3, 0.3)), s, s, 0, 1, 0.3);
            }
          } else if (k == 3) {
            const m = 2 + Math.floor(r() * 3);
            for (let i = 0; i < m; i++) {
              const s = rl(0.03, 0.055);
              add(move(c, rl(0.05, 0.12), rl(0, TAU)), s, s, 0, 2, 0.3);
            }
          } else {
            landmass(c, rl(0.035, 0.06), rl(0, TAU), 1.2, 0.9, 4 + Math.floor(r() * 5));
          }
        }
        for (const sg of [1, -1]) {
          const lon = rl(-Math.PI, Math.PI),
            la = sg * rl(1.12, 1.2);
          const c = sph(la, lon);
          landmass(c, rl(0.06, 0.09), 0, 0.35, 0.9, 9 + Math.floor(r() * 5));
          const c2 = sph(sg * rl(1.05, 1.25), lon + rl(1.6, 2.6) * (r() < 0.5 ? -1 : 1));
          landmass(c2, rl(0.04, 0.06), 0, 0.5, 0.9, 5 + Math.floor(r() * 3));
          for (let i = 0; i < 4; i++) {
            const s = rl(0.015, 0.04);
            add(move(c, rl(0.2, 0.45), rl(0, TAU)), s, s * 0.7, rl(0, 3), 0, 0.6);
          }
        }
      }

      function biome(T, Hm, el, cone, cr) {
        if (cr) return B.lava;
        if (T < -6) return B.ice;
        if (cone > 0.28 && el > 0.3) return B.ash;
        if (T < 1) return Hm > 0.3 ? B.tundra : B.polar;
        if (T < 7) return Hm > 0.35 ? B.taiga : B.tundra;
        if (T < 15) return Hm > 0.62 ? B.tf : Hm > 0.38 ? B.grass : B.steppe;
        if (T < 21) return Hm > 0.6 ? B.mf : Hm > 0.38 ? B.shrub : B.desert;
        return Hm > 0.7 ? B.rain : Hm > 0.52 ? B.tropf : Hm > 0.32 ? B.sav : B.desert;
      }

      function generate(s) {
        seed = s;
        const r = rng(s);
        initNoise(r);
        layout(r);
        const img = new Uint8ClampedArray(W * H * 4),
          E = new Float32Array(W * H),
          M = new Uint8Array(W * H);
        const deep = hex('#0d3560'),
          mid = hex('#1b6797'),
          shal = hex('#41aac8'),
          THR = 0.18;
        for (let y = 0; y < H; y++) {
          const la = Math.PI / 2 - ((y + 0.5) / H) * Math.PI,
            cla = Math.cos(la),
            sla = Math.sin(la);
          for (let x = 0; x < W; x++) {
            const lo = ((x + 0.5) / W) * TAU - Math.PI,
              px = cla * Math.sin(lo),
              py = sla,
              pz = cla * Math.cos(lo);
            let bF = -9,
              bC = 0,
              bCr = 0,
              bLag = 0,
              bSf = 1,
              nz = -1,
              n2 = 0,
              bK = 0,
              wx = 0,
              wy = 0,
              wz = 0;
            for (const s of isl) {
              const d = px * s.c[0] + py * s.c[1] + pz * s.c[2];
              if (d < s.cosR) continue;
              if (nz < 0) {
                nz = fbm(px * 11 + 7, py * 11, pz * 11, 7);
                n2 = fbm(px * 3.7 + 5, py * 3.7, pz * 3.7, 2);
                wx =
                  (fbm(px * 4 + 1, py * 4, pz * 4, 3) - 0.5) * 0.16 +
                  (fbm(px * 16 + 9, py * 16, pz * 16, 3) - 0.5) * 0.03;
                wy =
                  (fbm(px * 4 + 21, py * 4 + 5, pz * 4, 3) - 0.5) * 0.16 +
                  (fbm(px * 16, py * 16 + 9, pz * 16, 3) - 0.5) * 0.03;
                wz =
                  (fbm(px * 4, py * 4 + 13, pz * 4 + 7, 3) - 0.5) * 0.16 +
                  (fbm(px * 16 + 4, py * 16, pz * 16 + 9, 3) - 0.5) * 0.03;
              }
              const qx = px + wx,
                qy = py + wy,
                qz = pz + wz,
                X = (qx * s.e[0] + qy * s.e[1] + qz * s.e[2]) / s.a,
                Y = (qx * s.n[0] + qy * s.n[1] + qz * s.n[2]) / s.b;
              const rho = Math.sqrt(X * X + Y * Y) * (1 + 0.5 * (n2 - 0.5)),
                q = (nz - 0.5) * 2;
              let f,
                cone = 0,
                cr = 0,
                lag = 0;
              if (s.kind == 0) {
                const rid = 1 - Math.abs(fbm(px * 7 + 3, py * 7, pz * 7, 3) - 0.5) * 2;
                f = 1 - rho + s.amp * q - 0.45 * Math.pow(rid, 10);
              } else if (s.kind == 2) {
                f = 1.05 - 1.05 * rho + 0.22 * q;
                cone = Math.max(0, 1 - rho / 0.55);
                cone = Math.pow(cone, 1.4);
                cr = rho < 0.07 ? 1 : 0;
              } else {
                f = 1 - Math.abs(rho - 0.78) / 0.14 + s.amp * q;
                if (rho < 0.78 && f < THR) {
                  f = Math.max(f, 0.02);
                  lag = 1;
                } else if (rho < 1.1) f = Math.max(f, -0.1);
              }
              if (f > bF) {
                bF = f;
                bC = cone;
                bCr = cr;
                bLag = lag;
                bSf = s.sf;
                bK = s.kind;
              }
            }
            const i = y * W + x;
            let col;
            if (bF > THR) {
              M[i] = 1;
              let el = (bF - THR) * bSf;
              if (bK == 2) el = el * 0.5 + bC * 0.9;
              E[i] = el;
              const lat = la * 57.2958,
                cl2 = Math.cos(la);
              const T =
                35 * Math.pow(cl2, 1.2) -
                9 -
                el * 22 +
                (fbm(px * 2 + 3, py * 2, pz * 2, 2) - 0.5) * 5;
              const Hm = cl(
                0.5 +
                  0.32 * Math.cos(6 * la) +
                  (fbm(px * 2.6 + 9, py * 2.6, pz * 2.6, 3) - 0.5) * 0.9 +
                  (bSf < 0.7 ? 0.08 : 0),
                0,
                1
              );
              let b = biome(T, Hm, el, bC, bCr),
                c = b.c;
              if (!bCr && T >= -6) {
                if (el > 0.55) c = mix(c, B.rock.c, cl((el - 0.55) / 0.3, 0, 1));
                if (el < 0.05 && T > 3 && bK != 2) c = mix(B.sand.c, c, cl(el / 0.05, 0, 1));
                if (el < 0.035 && bK == 2) c = B.sand.c;
              }
              col = c;
            } else if (bLag) col = B.lag.c;
            else {
              const t = cl((bF + 0.55) / 0.75, 0, 1);
              col = t < 0.5 ? mix(deep, mid, t * 2) : mix(mid, shal, (t - 0.5) * 2);
            }
            img[i * 4] = col[0];
            img[i * 4 + 1] = col[1];
            img[i * 4 + 2] = col[2];
            img[i * 4 + 3] = 255;
          }
        }
        for (let y = 1; y < H - 1; y++)
          for (let x = 1; x < W - 1; x++) {
            const i = y * W + x;
            if (!M[i]) continue;
            const sh = cl(1 + 7 * (E[i - 1] - E[i + 1] + (E[i - W] - E[i + W]) * 0.4), 0.7, 1.3);
            for (let k = 0; k < 3; k++) img[i * 4 + k] = Math.min(255, img[i * 4 + k] * sh);
          }
        tex = document.createElement('canvas');
        tex.width = W;
        tex.height = H;
        const tc = tex.getContext('2d'),
          id = new ImageData(img, W, H);
        tc.putImageData(id, 0, 0);
        td = img;
        const fc = document.getElementById('f');
        fc.width = W;
        fc.height = H;
        fc.getContext('2d').drawImage(tex, 0, 0);
        document.getElementById('st').textContent =
          'Ziarno świata: ' + s + ' · wysp: ' + isl.length;
      }

      const cv = document.getElementById('g'),
        cx = cv.getContext('2d'),
        S = cv.width,
        R = S / 2;
      const out = cx.createImageData(S, S),
        od = out.data;
      function draw() {
        if (!td) return;
        const cl0 = Math.cos(lon0),
          sl0 = Math.sin(lon0),
          ph = -lat0,
          cp = Math.cos(ph),
          sp = Math.sin(ph);
        for (let py = 0; py < S; py++) {
          const y = (R - py - 0.5) / (R * zoom);
          for (let px = 0; px < S; px++) {
            const x = (px - R + 0.5) / (R * zoom),
              r2 = x * x + y * y,
              o = (py * S + px) * 4;
            if (r2 > 1) {
              od[o + 3] = 0;
              continue;
            }
            const z = Math.sqrt(1 - r2),
              y1 = y * cp - z * sp,
              z1 = y * sp + z * cp,
              x2 = x * cl0 + z1 * sl0,
              z2 = -x * sl0 + z1 * cl0;
            const lo = Math.atan2(x2, z2),
              la = Math.asin(y1);
            const u = (lo / TAU + 0.5) * W - 0.5,
              v = (0.5 - la / Math.PI) * H - 0.5,
              xf = Math.floor(u),
              yf = Math.floor(v),
              fx = u - xf,
              fy = v - yf;
            const x0 = (xf + W) % W,
              x1 = (x0 + 1) % W,
              ya = cl(yf, 0, H - 1),
              yb = cl(yf + 1, 0, H - 1);
            const t00 = (ya * W + x0) * 4,
              t10 = (ya * W + x1) * 4,
              t01 = (yb * W + x0) * 4,
              t11 = (yb * W + x1) * 4;
            const L = 0.3 + 0.85 * Math.max(0, -0.45 * x + 0.4 * y + 0.8 * z) * (0.6 + 0.4 * z);
            for (let c = 0; c < 3; c++) {
              const m =
                (td[t00 + c] * (1 - fx) + td[t10 + c] * fx) * (1 - fy) +
                (td[t01 + c] * (1 - fx) + td[t11 + c] * fx) * fy;
              od[o + c] = Math.min(255, m * L);
            }
            od[o + 3] = 255;
          }
        }
        cx.putImageData(out, 0, 0);
      }
      function loop() {
        if (spin && !drag) lon0 += 0.004;
        if (!flat) draw();
        requestAnimationFrame(loop);
      }
      const ptr = new Map(),
        zl = document.getElementById('zr');
      function setZoom(z) {
        zoom = cl(z, 1, 5);
        zl.textContent = zoom.toFixed(1) + '×';
      }
      cv.addEventListener('pointerdown', e => {
        ptr.set(e.pointerId, [e.clientX, e.clientY]);
        drag = true;
        cv.setPointerCapture(e.pointerId);
        cv.style.cursor = 'grabbing';
      });
      cv.addEventListener('pointermove', e => {
        const o = ptr.get(e.pointerId);
        if (!o) return;
        if (ptr.size == 2) {
          const [a, b] = [...ptr.values()],
            d0 = Math.hypot(a[0] - b[0], a[1] - b[1]);
          ptr.set(e.pointerId, [e.clientX, e.clientY]);
          const [a2, b2] = [...ptr.values()],
            d1 = Math.hypot(a2[0] - b2[0], a2[1] - b2[1]);
          if (d0 > 0) setZoom((zoom * d1) / d0);
          return;
        }
        const k = 2.6 / cv.clientWidth / zoom;
        lon0 -= (e.clientX - o[0]) * k;
        lat0 = cl(lat0 + (e.clientY - o[1]) * k, -1.4, 1.4);
        ptr.set(e.pointerId, [e.clientX, e.clientY]);
      });
      const up = e => {
        ptr.delete(e.pointerId);
        if (!ptr.size) {
          drag = false;
          cv.style.cursor = 'grab';
        }
      };
      cv.addEventListener('pointerup', up);
      cv.addEventListener('pointercancel', up);
      cv.addEventListener(
        'wheel',
        e => {
          e.preventDefault();
          setZoom(zoom * Math.exp(-e.deltaY * 0.0015));
        },
        { passive: false }
      );
      document.getElementById('zi').onclick = () => setZoom(zoom * 1.4);
      document.getElementById('zo').onclick = () => setZoom(zoom / 1.4);
      zl.onclick = () => setZoom(1);
      function build(s) {
        const st = document.getElementById('st');
        st.textContent = 'Generowanie świata…';
        setTimeout(() => generate(s), 30);
      }
      document.getElementById('nw').onclick = () => build(Math.floor(Math.random() * 1e6));
      document.getElementById('rot').onclick = e => {
        spin = !spin;
        e.target.textContent = 'Obrót: ' + (spin ? 'wł.' : 'wył.');
      };
      document.getElementById('fl').onclick = e => {
        flat = !flat;
        cv.style.display = flat ? 'none' : 'block';
        document.getElementById('f').style.display = flat ? 'block' : 'none';
        e.target.textContent = flat ? 'Globus' : 'Mapa płaska';
      };
      document.getElementById('lg').innerHTML = Object.values(B)
        .map(b => `<span><i style="background:${b.h}"></i>${b.n}</span>`)
        .join('');
      build(Math.floor(Math.random() * 1e6));
      loop();
    </script>
  </body>
</html>
