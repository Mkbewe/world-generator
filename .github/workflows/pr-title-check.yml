name: PR Title Check

on:
  pull_request:
    types: [opened, edited, reopened]

permissions:
  pull-requests: read
  statuses: write

concurrency:
  group: pr-title-${{ github.event.pull_request.number }}
  cancel-in-progress: true

jobs:
  validate-pr-title:
    name: Validate PR Title
    runs-on: ubuntu-latest
    steps:
      - name: Check PR title follows Conventional Commits
        uses: amannn/action-semantic-pull-request@v5
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        with:
          types: |
            feat
            fix
            docs
            style
            refactor
            perf
            test
            build
            ci
            chore
            revert
          requireScope: false
          subjectPattern: ^[a-z][^A-Z]*$
          subjectPatternError: |
            The subject "{subject}" found in PR title "{title}" must start with a lowercase letter and must not contain any uppercase letters.

            Valid examples:
            - feat: add new feature
            - fix(api): resolve null pointer exception
            - docs: update README
