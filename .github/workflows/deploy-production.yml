name: Promote to Production

on:
  workflow_dispatch:
    inputs:
      deployment_url:
        description: 'Dev deployment URL to promote. Leave empty to promote the current dev deployment.'
        required: false
        type: string
      confirm:
        description: 'Type "deploy" to confirm production promotion'
        required: true
        type: string

permissions:
  contents: write

jobs:
  validate:
    name: Validate Input
    runs-on: ubuntu-latest
    steps:
      - name: Check confirmation
        run: |
          if [ "${{ inputs.confirm }}" != "deploy" ]; then
            echo "❌ Promotion cancelled. You must type 'deploy' to confirm."
            exit 1
          fi

  promote:
    name: Promote deployment to Production
    runs-on: ubuntu-latest
    needs: validate
    outputs:
      deployment_url: ${{ steps.promote.outputs.url }}

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Promote to production
        id: promote
        uses: ./.github/actions/vercel-promote
        with:
          deployment_url: ${{ inputs.deployment_url }}
          vercel_token: ${{ secrets.VERCEL_TOKEN }}
          vercel_org_id: ${{ secrets.VERCEL_ORG_ID }}
          vercel_project_id: ${{ secrets.VERCEL_PROJECT_ID }}

      - name: Alias the promoted deployment
        env:
          VERCEL_TOKEN: ${{ secrets.VERCEL_TOKEN }}
          DEPLOYMENT_URL: ${{ steps.promote.outputs.url }}
        run: |
          VERSION=$(node -p "require('./package.json').version")
          ALIAS="wg-$(echo "$VERSION" | tr . -).vercel.app"

          # The alias keeps the release deployment out of the retention policy,
          # so old releases stay reachable from their GitHub release page.
          npx vercel@latest alias set "$DEPLOYMENT_URL" "$ALIAS" \
            --token="$VERCEL_TOKEN" \
            --scope=mkbewepp

      - name: Create deployment comment
        uses: actions/github-script@v7
        with:
          script: |
            github.rest.repos.createCommitComment({
              owner: context.repo.owner,
              repo: context.repo.repo,
              commit_sha: context.sha,
              body: `✅ Promoted to production\n🔗 ${{ steps.promote.outputs.url }}\n📦 Deployment: ${{ steps.promote.outputs.target }}`
            })

  release:
    name: Create GitHub Release
    needs: promote
    uses: ./.github/workflows/create-release.yml
    with:
      deployment_url: ${{ needs.promote.outputs.deployment_url }}
    permissions:
      contents: write
      pull-requests: write
