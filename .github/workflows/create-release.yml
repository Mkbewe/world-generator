name: Create GitHub Release

on:
  workflow_call:
  workflow_dispatch:

permissions:
  contents: write
  pull-requests: write

jobs:
  release:
    name: Create Release
    runs-on: ubuntu-latest

    steps:
      - name: Checkout code
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Check if version changed
        id: version_check
        run: |
          # Get current version from package.json
          CURRENT_VERSION=$(node -p "require('./package.json').version")
          echo "current_version=v${CURRENT_VERSION}" >> $GITHUB_OUTPUT

          # Check if tag already exists
          if git rev-parse "v${CURRENT_VERSION}" >/dev/null 2>&1; then
            echo "Tag v${CURRENT_VERSION} already exists, skipping release"
            echo "skip=true" >> $GITHUB_OUTPUT
          else
            echo "Creating new release for v${CURRENT_VERSION}"
            echo "skip=false" >> $GITHUB_OUTPUT
          fi

      - name: Extract changelog for current version
        if: steps.version_check.outputs.skip == 'false'
        id: changelog
        run: |
          VERSION=${{ steps.version_check.outputs.current_version }}

          # Extract changelog section for this version
          if [ -f "CHANGELOG.md" ]; then
            # Patches use "### [x]" and minor/major releases use "## [x]".
            # Capture only the requested version, stopping at the next version header.
            awk -v version="${VERSION#v}" '
              /^## \[/ || /^### \[/ {
                if (inside) exit
                if (index($0, "[" version "]") > 0) { inside = 1; next }
              }
              inside { print }
            ' CHANGELOG.md > /tmp/release_notes.md

            if [ -s /tmp/release_notes.md ]; then
              echo "has_changelog=true" >> $GITHUB_OUTPUT
            else
              echo "has_changelog=false" >> $GITHUB_OUTPUT
            fi
          else
            echo "No CHANGELOG.md found"
            echo "has_changelog=false" >> $GITHUB_OUTPUT
          fi

      - name: Create Git Tag
        if: steps.version_check.outputs.skip == 'false'
        run: |
          VERSION=${{ steps.version_check.outputs.current_version }}
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git tag -a "$VERSION" -m "Release $VERSION"
          git push origin "$VERSION"

      - name: Create GitHub Release
        if: steps.version_check.outputs.skip == 'false'
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          VERSION=${{ steps.version_check.outputs.current_version }}

          if [ "${{ steps.changelog.outputs.has_changelog }}" == "true" ]; then
            gh release create "$VERSION" \
              --title "Release $VERSION" \
              --notes-file /tmp/release_notes.md
          else
            gh release create "$VERSION" \
              --title "Release $VERSION" \
              --generate-notes
          fi
