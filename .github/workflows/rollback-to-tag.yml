name: Rollback to Version

on:
  workflow_dispatch:
    inputs:
      version:
        description: 'Version to rollback to (e.g., v0.0.5)'
        required: true
        type: string
      environment:
        description: 'Target environment'
        required: true
        type: choice
        options:
          - production
          - dev
        default: production
      confirm:
        description: 'Type "rollback" to confirm'
        required: true
        type: string

jobs:
  validate:
    name: Validate Input
    runs-on: ubuntu-latest
    steps:
      - name: Check confirmation
        run: |
          if [ "${{ inputs.confirm }}" != "rollback" ]; then
            echo "❌ Rollback cancelled. You must type 'rollback' to confirm."
            exit 1
          fi

      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Verify tag exists
        run: |
          if ! git rev-parse ${{ inputs.version }} >/dev/null 2>&1; then
            echo "❌ Tag ${{ inputs.version }} does not exist"
            exit 1
          fi

  rollback:
    name: Rollback to ${{ inputs.version }}
    runs-on: ubuntu-latest
    needs: validate

    steps:
      - name: Checkout specific tag
        uses: actions/checkout@v4
        with:
          ref: ${{ inputs.version }}

      - name: Deploy to Vercel
        uses: amondnet/vercel-action@v25
        id: deploy
        with:
          vercel-token: ${{ secrets.VERCEL_TOKEN }}
          vercel-org-id: ${{ secrets.VERCEL_ORG_ID}}
          vercel-project-id: ${{ secrets.VERCEL_PROJECT_ID}}
          vercel-args: ${{ inputs.environment == 'production' && '--prod' || '--prod=false' }}
          alias-domains: ${{ inputs.environment == 'production' && '' || 'world-generator.dev.vercel.app' }}

      - name: Create rollback notification
        uses: actions/github-script@v7
        with:
          script: |
            github.rest.repos.createCommitComment({
              owner: context.repo.owner,
              repo: context.repo.repo,
              commit_sha: context.sha,
              body: `🔄 Rolled back ${{ inputs.environment }} to ${{ inputs.version }}\nDeployment: ${{ steps.deploy.outputs.preview-url }}`
            })
