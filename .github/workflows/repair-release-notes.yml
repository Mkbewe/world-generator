name: Repair release notes

on:
  workflow_dispatch:
    inputs:
      dry_run:
        description: Print the extracted notes without updating releases
        type: boolean
        default: true
      tags:
        description: Space separated tags to repair (empty = all releases)
        type: string
        default: ''

permissions:
  contents: write

jobs:
  repair:
    name: Repair release notes
    runs-on: ubuntu-latest

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Update release notes from CHANGELOG.md
        env:
          GH_TOKEN: ${{ github.token }}
          DRY_RUN: ${{ inputs.dry_run }}
          TAGS: ${{ inputs.tags }}
        run: |
          set -euo pipefail

          if [ -z "$TAGS" ]; then
            TAGS=$(gh release list --limit 100 --json tagName --jq '.[].tagName')
          fi

          for TAG in $TAGS; do
            VERSION="${TAG#v}"

            awk -v version="$VERSION" '
              /^## \[/ || /^### \[/ {
                if (inside) exit
                if (index($0, "[" version "]") > 0) { inside = 1; next }
              }
              inside { print }
            ' CHANGELOG.md > /tmp/release_notes.md

            if [ ! -s /tmp/release_notes.md ]; then
              echo "::warning::$TAG has no CHANGELOG.md section, skipping"
              continue
            fi

            if [ "$DRY_RUN" = "true" ]; then
              echo "===== $TAG (dry run) ====="
              head -n 30 /tmp/release_notes.md
            else
              gh release edit "$TAG" --notes-file /tmp/release_notes.md
              echo "Updated $TAG"
            fi
          done
