name: Rollback Production

on:
  workflow_dispatch:
    inputs:
      deployment_url:
        description: 'Deployment URL to roll back to (a previous good deployment)'
        required: true
        type: string
      confirm:
        description: 'Type "rollback" to confirm'
        required: true
        type: string

permissions:
  contents: write

jobs:
  validate:
    name: Validate Input
    runs-on: ubuntu-latest
    steps:
      - name: Check confirmation
        run: |
          if [ "${{ inputs.confirm }}" != "rollback" ]; then
            echo "❌ Rollback cancelled. You must type 'rollback' to confirm."
            exit 1
          fi

  rollback:
    name: Roll back production
    runs-on: ubuntu-latest
    needs: validate

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Promote previous deployment to production
        id: promote
        uses: ./.github/actions/vercel-promote
        with:
          deployment_url: ${{ inputs.deployment_url }}
          vercel_token: ${{ secrets.VERCEL_TOKEN }}
          vercel_org_id: ${{ secrets.VERCEL_ORG_ID }}
          vercel_project_id: ${{ secrets.VERCEL_PROJECT_ID }}

      - name: Create rollback comment
        uses: actions/github-script@v7
        with:
          script: |
            github.rest.repos.createCommitComment({
              owner: context.repo.owner,
              repo: context.repo.repo,
              commit_sha: context.sha,
              body: `🔄 Rolled back production\n🔗 ${{ steps.promote.outputs.url }}\n📦 Deployment: ${{ steps.promote.outputs.target }}`
            })
