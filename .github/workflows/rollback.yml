name: Rollback Production

on:
  workflow_dispatch:
    inputs:
      deployment_url:
        description: 'Deployment URL to roll back to (a previous good deployment)'
        required: true
        type: string
      confirm:
        description: 'Type "rollback" to confirm'
        required: true
        type: string

permissions:
  contents: write

jobs:
  validate:
    name: Validate Input
    runs-on: ubuntu-latest
    steps:
      - name: Check confirmation
        run: |
          if [ "${{ inputs.confirm }}" != "rollback" ]; then
            echo "❌ Rollback cancelled. You must type 'rollback' to confirm."
            exit 1
          fi

  rollback:
    name: Roll back production
    runs-on: ubuntu-latest
    needs: validate
    env:
      VERCEL_ORG_ID: ${{ secrets.VERCEL_ORG_ID }}
      VERCEL_PROJECT_ID: ${{ secrets.VERCEL_PROJECT_ID }}

    steps:
      - name: Promote previous deployment to production
        run: |
          npx vercel@latest promote "${{ inputs.deployment_url }}" \
            --yes \
            --token=${{ secrets.VERCEL_TOKEN }}

      - name: Create rollback comment
        uses: actions/github-script@v7
        with:
          script: |
            github.rest.repos.createCommitComment({
              owner: context.repo.owner,
              repo: context.repo.repo,
              commit_sha: context.sha,
              body: `🔄 Rolled back production to: ${{ inputs.deployment_url }}`
            })
